<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>계산서</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{margin:0;background:#09090b}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useRef } = React;

const won = (m) => "₩" + Math.round((Number(m) || 0) * 10000).toLocaleString("ko-KR");
const num = (v) => v.replace(/[^0-9.]/g, "").replace(/(\..*)\./g, "$1");
const f1 = (n) => (Number.isInteger(n) ? String(n) : n.toFixed(1));
const r1 = (n) => Math.round(n * 10) / 10;

const Svg = ({ size = 16, children }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>
);
const Plus = (p) => <Svg {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Svg>;
const Trash = (p) => <Svg {...p}><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></Svg>;
const Copy = (p) => <Svg {...p}><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></Svg>;
const Check = (p) => <Svg {...p}><path d="M20 6 9 17l-5-5"/></Svg>;
const Users = (p) => <Svg {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></Svg>;
const Wine = (p) => <Svg {...p}><path d="M8 22h8"/><path d="M7 10h10"/><path d="M12 15v7"/><path d="M12 15a5 5 0 0 0 5-5c0-2-.5-4-1-7H8c-.5 3-1 5-1 7a5 5 0 0 0 5 5Z"/></Svg>;

function NumStepper({ value, set, min = 0, step = 1 }) {
  const onChange = (e) => {
    const n = parseFloat(e.target.value.replace(/[^0-9.]/g, ""));
    set(isNaN(n) ? min : Math.max(min, n));
  };
  return (
    <div className="flex items-center border border-zinc-700 rounded-lg overflow-hidden">
      <button onClick={() => set((p) => Math.max(min, r1(p - step)))} className="px-3 py-2 bg-zinc-800 text-lg leading-none active:bg-zinc-700">−</button>
      <input inputMode="decimal" value={value} onChange={onChange} className="w-12 text-center bg-zinc-900 py-2 text-base text-zinc-100 focus:outline-none" />
      <button onClick={() => set((p) => r1(p + step))} className="px-3 py-2 bg-zinc-800 text-lg leading-none active:bg-zinc-700">＋</button>
    </div>
  );
}

function CalcSheet() {
  const [people, setPeople] = useState(1);
  const [bottles, setBottles] = useState(0);
  const [bottlePrice, setBottlePrice] = useState("");
  const [tcOn, setTcOn] = useState("");
  const [tcOff, setTcOff] = useState("");
  const [helpers, setHelpers] = useState([{ id: 1, name: "", time: 1, wing: false, nom: false }]);
  const [items, setItems] = useState([
    { id: 1, name: "룸티", amount: "", waiter: true },
    { id: 2, name: "사입", amount: "", waiter: true },
  ]);
  const [sipMemo, setSipMemo] = useState("");
  const [splitMode, setSplitMode] = useState("bottle");
  const [copied, setCopied] = useState(false);
  const hId = useRef(2), iId = useRef(3);

  const liquorAmt = bottles * (Number(bottlePrice) || 0);
  const onP = Number(tcOn) || 0, offP = Number(tcOff) || 0;
  const calcTc = (h) => {
    const t = Number(h.time) || 0;
    const onT = splitMode === "first" ? (bottles > 0 ? Math.min(t, 1) : 0) : Math.min(t, bottles);
    const offT = Math.max(0, t - onT);
    const base = Math.ceil(onT * onP + offT * offP);
    return { onT, offT, amt: base + (h.nom ? t : 0) };
  };
  const tcTotal = useMemo(() => helpers.reduce((s, h) => s + calcTc(h).amt, 0), [helpers, tcOn, tcOff, bottles, splitMode]);
  const wingCount = useMemo(() => helpers.filter((h) => h.wing).length, [helpers]);
  const itemsTotal = useMemo(() => items.reduce((s, it) => s + (Number(it.amount) || 0), 0), [items]);
  const waiterTotal = useMemo(() => items.reduce((s, it) => s + (it.waiter ? Number(it.amount) || 0 : 0), 0), [items]);
  const total = liquorAmt + tcTotal + itemsTotal;

  const upH = (id, p) => setHelpers((a) => a.map((h) => (h.id === id ? { ...h, ...p } : h)));
  const addH = () => setHelpers((a) => [...a, { id: ++hId.current, name: "", time: 1, wing: false, nom: false }]);
  const rmH = (id) => setHelpers((a) => a.filter((h) => h.id !== id));
  const upI = (id, p) => setItems((a) => a.map((it) => (it.id === id ? { ...it, ...p } : it)));
  const addI = () => setItems((a) => [...a, { id: ++iId.current, name: "", amount: "", waiter: false }]);
  const rmI = (id) => setItems((a) => a.filter((it) => it.id !== id));
  const setHTime = (id, cur) => (fn) => upH(id, { time: typeof fn === "function" ? fn(Number(cur) || 0) : fn });

  const billText = useMemo(() => {
    const L = [`[계산서]  ${people}인`, "──────────────"];
    if (bottles > 0) L.push(`술  ${won(bottlePrice)} × ${bottles}병  =  ${won(liquorAmt)}`);
    helpers.forEach((h) => {
      if (!h.name && !Number(h.time)) return;
      L.push(`${h.name || "도우미"}  ${f1(Number(h.time) || 0)}타임${h.nom ? " 지명" : ""}  ${won(calcTc(h).amt)}`);
    });
    items.forEach((it) => { if (it.name || Number(it.amount)) L.push(`${it.name || "항목"}  ${won(it.amount)}`); });
    if (sipMemo.trim()) L.push(`사입내역) ${sipMemo.trim()}`);
    L.push("──────────────", `합계   ${won(total)}`);
    return L.join("\n");
  }, [people, bottles, bottlePrice, liquorAmt, helpers, tcOn, tcOff, items, sipMemo, total, splitMode]);

  const copy = async () => {
    try { await navigator.clipboard.writeText(billText); }
    catch {
      const ta = document.createElement("textarea"); ta.value = billText;
      document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }
    setCopied(true); setTimeout(() => setCopied(false), 1500);
  };

  const inp = "bg-zinc-900 border border-zinc-700 rounded-lg px-2 py-1.5 text-right text-zinc-100 text-sm focus:outline-none focus:border-amber-500 placeholder:text-zinc-700";
  const txt = "bg-zinc-900 border border-zinc-700 rounded-lg px-2 py-1.5 text-zinc-100 text-sm focus:outline-none focus:border-amber-500 placeholder:text-zinc-700";
  const card = "bg-zinc-900/60 border border-zinc-800 rounded-xl p-3";

  return (
    <div className="min-h-screen bg-zinc-950 text-zinc-200" style={{fontFamily:"-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif"}}>
      <div className="max-w-md mx-auto px-4 py-6 pb-28">
        <div className="mb-5">
          <h1 className="text-2xl font-bold tracking-tight text-amber-400">계산서</h1>
          <p className="text-xs text-zinc-500 mt-1">{new Date().toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "short" })} · 단위 만원</p>
        </div>

        <div className="flex items-center justify-between bg-zinc-900/60 border border-zinc-800 rounded-xl px-3 py-2 mb-3">
          <span className="flex items-center gap-1.5 text-sm text-zinc-400"><Users size={15} /><span className="text-amber-400 inline-flex"></span>인원</span>
          <NumStepper value={people} set={setPeople} min={1} step={1} />
        </div>

        <div className={card + " mb-3"}>
          <div className="flex items-center gap-1.5 text-sm font-medium text-amber-300 mb-3"><Wine size={15} /> 술</div>
          <div className="flex items-center justify-between gap-3">
            <div className="flex items-center gap-2">
              <span className="text-xs text-zinc-400">병수</span>
              <NumStepper value={bottles} set={setBottles} min={0} step={1} />
            </div>
            <div className="flex items-center gap-2">
              <span className="text-xs text-zinc-400">단가</span>
              <input inputMode="decimal" value={bottlePrice} onChange={(e) => setBottlePrice(num(e.target.value))} placeholder="만원" className={inp + " w-24"} />
            </div>
          </div>
          <div className="text-right mt-2 text-sm"><span className="text-zinc-500">금액 </span><span className="font-semibold text-amber-300">{won(liquorAmt)}</span></div>
        </div>

        <div className={card + " mb-3"}>
          <div className="flex items-center justify-between mb-1">
            <span className="text-sm font-medium text-zinc-100">티씨 단가</span>
            <div className="flex items-center gap-2 text-xs">
              <span className="text-amber-300">술O</span>
              <input inputMode="decimal" value={tcOn} onChange={(e) => setTcOn(num(e.target.value))} className={inp + " w-14"} />
              <span className="text-zinc-400">술X</span>
              <input inputMode="decimal" value={tcOff} onChange={(e) => setTcOff(num(e.target.value))} className={inp + " w-14"} />
            </div>
          </div>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-[11px] text-zinc-500">술O 적용</span>
            <div className="flex rounded-lg overflow-hidden border border-zinc-700">
              <button onClick={() => setSplitMode("bottle")} className={"px-2 py-1 text-[11px] " + (splitMode === "bottle" ? "bg-amber-500 text-zinc-950" : "text-zinc-400")}>병수만큼</button>
              <button onClick={() => setSplitMode("first")} className={"px-2 py-1 text-[11px] " + (splitMode === "first" ? "bg-amber-500 text-zinc-950" : "text-zinc-400")}>첫타임만</button>
            </div>
          </div>
          {(!tcOn || !tcOff)
            ? <p className="text-[11px] text-red-400/80 mb-3">⚠ 술O·술X 단가를 둘 다 채워야 계산돼요</p>
            : <p className="text-[11px] text-zinc-500 mb-3">{splitMode === "first"
                ? `첫 타임만 술O(${tcOn}), 나머지 술X(${tcOff})`
                : `술 ${bottles}병 → ${bottles}타임 술O(${tcOn}), 나머지 술X(${tcOff})`} · 지명 타임당 +1</p>}

          <div className="space-y-2">
            {helpers.map((h) => {
              const { onT, offT, amt } = calcTc(h);
              return (
                <div key={h.id} className="bg-zinc-900/50 rounded-lg p-2 space-y-2">
                  <div className="flex items-center gap-2">
                    <input value={h.name} onChange={(e) => upH(h.id, { name: e.target.value })} placeholder="이름" className="flex-1 min-w-0 bg-zinc-900 border border-zinc-700 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-amber-500 placeholder:text-zinc-700" />
                    <div className="text-right shrink-0">
                      <div className="text-sm text-zinc-200">{won(amt)}</div>
                      {(onT > 0 || offT > 0 || h.nom) && <div className="text-[9px] text-zinc-500">O{f1(onT)}·X{f1(offT)}{h.nom ? " +지명" : ""}</div>}
                    </div>
                    <button onClick={() => rmH(h.id)} className="text-zinc-600 active:text-red-400 shrink-0"><Trash size={15} /></button>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <button onClick={() => upH(h.id, { nom: !h.nom })} className={"text-[11px] px-2 py-1.5 rounded-lg border " + (h.nom ? "border-emerald-500/60 text-emerald-400 bg-emerald-500/10" : "border-zinc-700 text-zinc-500")}>지명</button>
                    <button onClick={() => upH(h.id, { wing: !h.wing })} className={"text-[11px] px-2 py-1.5 rounded-lg border " + (h.wing ? "border-amber-500/60 text-amber-400 bg-amber-500/10" : "border-zinc-700 text-zinc-500")}>날개</button>
                    <div className="ml-auto flex items-center gap-1.5">
                      <span className="text-[10px] text-zinc-500">타임</span>
                      <NumStepper value={h.time} set={setHTime(h.id, h.time)} min={0} step={0.5} />
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          <button onClick={addH} className="w-full mt-2 flex items-center justify-center gap-1 text-xs text-zinc-400 border border-dashed border-zinc-700 rounded-lg py-2"><Plus size={13} /> 도우미 추가</button>
          <div className="text-right mt-2 text-sm"><span className="text-zinc-500">티씨 합계 </span><span className="font-semibold text-zinc-100">{won(tcTotal)}</span>{wingCount > 0 && <span className="text-[11px] text-amber-400/80"> · 날개 {wingCount}</span>}</div>
        </div>

        <div className={card}>
          <span className="text-sm font-medium text-zinc-100">룸티 · 사입 · 기타</span>
          <div className="space-y-2 mt-3">
            {items.map((it) => (
              <div key={it.id} className="flex items-center gap-2">
                <input value={it.name} onChange={(e) => upI(it.id, { name: e.target.value })} placeholder="항목명" className="flex-1 min-w-0 bg-zinc-900 border border-zinc-700 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-amber-500 placeholder:text-zinc-700" />
                <input inputMode="decimal" value={it.amount} onChange={(e) => upI(it.id, { amount: num(e.target.value) })} placeholder="만원" className={inp + " w-20"} />
                <button onClick={() => upI(it.id, { waiter: !it.waiter })} className={"text-[10px] px-1.5 py-1 rounded-md border whitespace-nowrap " + (it.waiter ? "border-sky-500/60 text-sky-300 bg-sky-500/10" : "border-zinc-700 text-zinc-600")}>받을돈</button>
                <button onClick={() => rmI(it.id)} className="text-zinc-600 active:text-red-400"><Trash size={15} /></button>
              </div>
            ))}
          </div>
          <button onClick={addI} className="w-full mt-2 flex items-center justify-center gap-1 text-xs text-zinc-400 border border-dashed border-zinc-700 rounded-lg py-2"><Plus size={13} /> 항목 추가</button>
          <div className="mt-3 pt-3 border-t border-zinc-800">
            <label className="text-xs text-zinc-400 block mb-1">사입 내역 메모 <span className="text-[10px] text-zinc-600">계산 X · 손님 확인용</span></label>
            <textarea value={sipMemo} onChange={(e) => setSipMemo(e.target.value)} rows={2} placeholder="예) 발렌타인 12년, 안주 과일" className={txt + " w-full text-left resize-none"} />
          </div>
        </div>

        <div className="mt-6 space-y-2">
          <div className="flex items-center justify-between px-1">
            <span className="text-zinc-400">손님 합계</span>
            <span className="text-3xl font-bold text-amber-400 tracking-tight">{won(total)}</span>
          </div>
          <div className="flex items-center justify-between px-1 border-t border-zinc-800 pt-2">
            <span className="text-zinc-400 text-sm">웨이터 받을돈 <span className="text-[10px] text-zinc-600">룸티+사입</span></span>
            <span className="text-xl font-bold text-sky-400">{won(waiterTotal)}</span>
          </div>
        </div>

        <div className="mt-6">
          <div className="flex items-center justify-between mb-2">
            <span className="text-sm text-zinc-400">손님 문자 미리보기</span>
            <button onClick={copy} className="flex items-center gap-1 text-xs px-3 py-1.5 rounded-lg bg-amber-500 text-zinc-950 font-semibold active:bg-amber-400">
              {copied ? <span className="flex items-center gap-1"><Check size={14} /> 복사됨</span> : <span className="flex items-center gap-1"><Copy size={14} /> 복사</span>}
            </button>
          </div>
          <pre className="bg-zinc-900 border border-zinc-800 rounded-xl p-4 text-sm text-zinc-300 whitespace-pre-wrap leading-relaxed" style={{fontFamily:"ui-monospace,SFMono-Regular,monospace"}}>{billText}</pre>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CalcSheet />);
</script>
</body>
</html>
