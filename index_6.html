<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>계산서</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{margin:0;background:#09090b}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useRef, useEffect } = React;

const won = (m) => "₩" + Math.round((Number(m) || 0) * 10000).toLocaleString("ko-KR");
const num = (v) => v.replace(/[^0-9.]/g, "").replace(/(\..*)\./g, "$1");
const f1 = (n) => (Number.isInteger(n) ? String(n) : n.toFixed(1));
const r1 = (n) => Math.round(n * 10) / 10;
const todayStr = () => { const d = new Date(); return `${d.getMonth() + 1}/${d.getDate()}`; };
const load = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

const Svg = ({ size = 16, fill = "none", children }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>
);
const Plus = (p) => <Svg {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Svg>;
const Trash2 = (p) => <Svg {...p}><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></Svg>;
const Copy = (p) => <Svg {...p}><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></Svg>;
const Check = (p) => <Svg {...p}><path d="M20 6 9 17l-5-5"/></Svg>;
const Users = (p) => <Svg {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></Svg>;
const Wine = (p) => <Svg {...p}><path d="M8 22h8"/><path d="M7 10h10"/><path d="M12 15v7"/><path d="M12 15a5 5 0 0 0 5-5c0-2-.5-4-1-7H8c-.5 3-1 5-1 7a5 5 0 0 0 5 5Z"/></Svg>;
const Star = ({ size = 16, fill = "none" }) => <Svg size={size} fill={fill}><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></Svg>;
const Back = (p) => <Svg {...p}><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></Svg>;

function NumStepper({ value, set, min = 0, step = 1 }) {
  const onChange = (e) => { const n = parseFloat(e.target.value.replace(/[^0-9.]/g, "")); set(isNaN(n) ? min : Math.max(min, n)); };
  return (
    <div className="flex items-center border border-zinc-700 rounded-lg overflow-hidden">
      <button onClick={() => set((p) => Math.max(min, r1(p - step)))} className="px-3 py-2 bg-zinc-800 text-lg leading-none active:bg-zinc-700">−</button>
      <input inputMode="decimal" value={value} onChange={onChange} className="w-12 text-center bg-zinc-900 py-2 text-base text-zinc-100 focus:outline-none" />
      <button onClick={() => set((p) => r1(p + step))} className="px-3 py-2 bg-zinc-800 text-lg leading-none active:bg-zinc-700">＋</button>
    </div>
  );
}

// 시작시간(12시간제) → 가장 가까운 과거 시각 → 경과분 → 타임 자동계산
const parseStart = (str) => {
  if (!str) return null;
  const s = String(str).replace(/[^0-9.:]/g, "").replace(":", ".");
  const p = s.split("."); let hh = parseInt(p[0], 10);
  if (isNaN(hh)) return null;
  let mm = 0;
  if (p[1] != null && p[1] !== "") mm = p[1].length === 1 ? parseInt(p[1], 10) * 10 : parseInt(p[1].slice(0, 2), 10);
  if (isNaN(mm)) mm = 0;
  return { hh, mm: Math.min(59, Math.max(0, mm)) };
};
const startMs = (p, nowMs) => {
  if (!p) return null;
  const hrs = p.hh <= 12 ? [p.hh % 12, (p.hh % 12) + 12] : [p.hh % 24];
  const cands = [];
  for (const H of hrs) for (const off of [0, -1]) {
    const d = new Date(nowMs); d.setHours(H, p.mm, 0, 0); d.setDate(d.getDate() + off); cands.push(d.getTime());
  }
  const past = cands.filter((t) => t <= nowMs + 60000);
  return past.length ? Math.max(...past) : Math.min(...cands);
};
const autoTime = (E) => {
  if (E <= 0) return 0;
  const h = Math.floor(E / 60), r = E % 60;
  let add = 0;
  if (r <= 5) add = 0; else if (r <= 10) add = h >= 1 ? 0.2 : 0; else if (r <= 30) add = 0.5; else add = 1;
  return Math.round((h + add) * 10) / 10;
};
const effTime = (h, nowMs) => {
  if (h.manual != null && h.manual !== "") return Number(h.manual) || 0;
  if (h.start) { const sMs = startMs(parseStart(h.start), nowMs); if (sMs != null) return autoTime(Math.max(0, Math.round(((h.end || nowMs) - sMs) / 60000))); }
  return Number(h.time) || 0;
};

const newSheet = () => ({
  id: "s" + Date.now() + Math.floor(Math.random() * 1000),
  date: todayStr(), room: "", waiter: "", part: "1부", done: false, ts: Date.now(),
  guestMode: "남", numGuest: 1,
  drinks: [{ id: 1, name: "", bottles: 1, price: "" }],
  tcOn: "", tcOff: "", mTcOn: "", mTcOff: "", splitMode: "bottle",
  helpers: [{ id: 1, name: "", start: "", end: null, manual: null, wing: false, nom: false }],
  mHelpers: [{ id: 1, name: "", start: "", end: null, manual: null, wing: false, nom: false }],
  items: [
    { id: 1, name: "룸티", amount: "", waiter: true, discount: false },
    { id: 2, name: "사입", amount: "", waiter: true, discount: false },
    { id: 3, name: "서비스", amount: "", waiter: false, discount: true },
  ],
  sipMemo: "",
});

// 합계만 계산 (목록 카드용)
const sheetTotal = (s) => {
  const totalBottles = s.drinks.reduce((a, d) => a + (Number(d.bottles) || 0), 0);
  const liquor = s.drinks.reduce((a, d) => a + (Number(d.bottles) || 0) * (Number(d.price) || 0), 0);
  const tc = (list, onP, offP) => list.reduce((a, h) => {
    const t = effTime(h, Date.now());
    const onT = s.splitMode === "first" ? (totalBottles > 0 ? Math.min(t, 1) : 0) : Math.min(t, totalBottles);
    const offT = Math.max(0, t - onT);
    return a + Math.ceil(onT * (Number(onP) || 0) + offT * (Number(offP) || 0)) + (h.nom ? t : 0);
  }, 0);
  const tcT = tc(s.helpers, s.tcOn, s.tcOff);
  const mT = s.guestMode === "아베크" ? tc(s.mHelpers, s.mTcOn, s.mTcOff) : 0;
  const it = s.items.reduce((a, x) => a + (x.discount ? -1 : 1) * (Number(x.amount) || 0), 0);
  return liquor + tcT + mT + it;
};

function CalcSheet({ sheet, onChange, onBack, onToggleDone, onDelete, savedDrinks, setSavedDrinks }) {
  const [copied, setCopied] = useState(false);
  const [showHelp, setShowHelp] = useState(false);
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const id = setInterval(() => setNow(Date.now()), 20000); return () => clearInterval(id); }, []);
  const s = sheet;
  const set = (p) => onChange({ ...s, ...p });

  const totalBottles = s.drinks.reduce((a, d) => a + (Number(d.bottles) || 0), 0);
  const liquorAmt = s.drinks.reduce((a, d) => a + (Number(d.bottles) || 0) * (Number(d.price) || 0), 0);

  const upD = (id, p) => set({ drinks: s.drinks.map((d) => (d.id === id ? { ...d, ...p } : d)) });
  const addD = () => set({ drinks: [...s.drinks, { id: Date.now(), name: "", bottles: 1, price: "" }] });
  const rmD = (id) => set({ drinks: s.drinks.length > 1 ? s.drinks.filter((d) => d.id !== id) : s.drinks });
  const setDBottles = (id, cur) => (fn) => upD(id, { bottles: typeof fn === "function" ? fn(Number(cur) || 0) : fn });
  const isSaved = (name) => savedDrinks.some((x) => x.name === (name || "").trim());
  const toggleSave = (d) => { const nm = (d.name || "").trim(); if (!nm) return; setSavedDrinks(isSaved(nm) ? savedDrinks.filter((x) => x.name !== nm) : [...savedDrinks, { name: nm, price: d.price }]); };
  const useSaved = (sd) => { const i = s.drinks.findIndex((d) => !d.name && !Number(d.price)); if (i >= 0) { const c = [...s.drinks]; c[i] = { ...c[i], name: sd.name, price: sd.price }; set({ drinks: c }); } else set({ drinks: [...s.drinks, { id: Date.now(), name: sd.name, bottles: 1, price: sd.price }] }); };

  const onP = Number(s.tcOn) || 0, offP = Number(s.tcOff) || 0, mOnP = Number(s.mTcOn) || 0, mOffP = Number(s.mTcOff) || 0;
  const calcTc = (h, onPrice, offPrice) => {
    const t = effTime(h, now);
    const onT = s.splitMode === "first" ? (totalBottles > 0 ? Math.min(t, 1) : 0) : Math.min(t, totalBottles);
    const offT = Math.max(0, t - onT);
    return { onT, offT, amt: Math.ceil(onT * onPrice + offT * offPrice) + (h.nom ? t : 0) };
  };
  const totalTimes = s.helpers.reduce((a, h) => a + effTime(h, now), 0) + (s.guestMode === "아베크" ? s.mHelpers.reduce((a, h) => a + effTime(h, now), 0) : 0);
  const shortBottles = s.splitMode === "bottle" && totalTimes > totalBottles && totalTimes > 0;
  const tcTotal = s.helpers.reduce((a, h) => a + calcTc(h, onP, offP).amt, 0);
  const mTcTotal = s.guestMode === "아베크" ? s.mHelpers.reduce((a, h) => a + calcTc(h, mOnP, mOffP).amt, 0) : 0;
  const wingCount = [...s.helpers, ...(s.guestMode === "아베크" ? s.mHelpers : [])].filter((h) => h.wing).length;
  const itemsTotal = s.items.reduce((a, it) => a + (it.discount ? -1 : 1) * (Number(it.amount) || 0), 0);
  const waiterTotal = s.items.reduce((a, it) => a + (it.waiter && !it.discount ? Number(it.amount) || 0 : 0), 0);
  const total = liquorAmt + tcTotal + mTcTotal + itemsTotal;

  const upI = (id, p) => set({ items: s.items.map((it) => (it.id === id ? { ...it, ...p } : it)) });
  const addI = () => set({ items: [...s.items, { id: Date.now(), name: "", amount: "", waiter: false, discount: false }] });
  const rmI = (id) => set({ items: s.items.filter((it) => it.id !== id) });

  const billText = useMemo(() => {
    const head = [s.date, s.room, s.waiter, s.part].filter(Boolean).join(" · ");
    const L = [`[계산서] ${head}`, `${s.guestMode} ${s.numGuest}`, "──────────────"];
    s.drinks.forEach((d) => { if (d.name || Number(d.price)) L.push(`${d.name || "술"}  ${won(d.price)} × ${Number(d.bottles) || 0}병  =  ${won((Number(d.bottles) || 0) * (Number(d.price) || 0))}`); });
    s.helpers.forEach((h) => { if (h.name || effTime(h, now)) L.push(`${h.name || "도우미"}  ${f1(effTime(h, now))}타임${h.nom ? " 지명" : ""}  ${won(calcTc(h, onP, offP).amt)}`); });
    if (s.guestMode === "아베크") s.mHelpers.forEach((h) => { if (h.name || effTime(h, now)) L.push(`(선수) ${h.name || "도우미"}  ${f1(effTime(h, now))}타임${h.nom ? " 지명" : ""}  ${won(calcTc(h, mOnP, mOffP).amt)}`); });
    s.items.forEach((it) => { if (it.name || Number(it.amount)) L.push(`${it.name || "항목"}  ${it.discount ? "-" : ""}${won(it.amount)}`); });
    if (s.sipMemo.trim()) L.push(`사입내역) ${s.sipMemo.trim()}`);
    L.push("──────────────", `합계   ${won(total)}`);
    return L.join("\n");
  }, [s, total, now]);

  const copy = async () => {
    try { await navigator.clipboard.writeText(billText); }
    catch { const ta = document.createElement("textarea"); ta.value = billText; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e) {} document.body.removeChild(ta); }
    setCopied(true); setTimeout(() => setCopied(false), 1500);
  };

  const inp = "bg-zinc-900 border border-zinc-700 rounded-lg px-2 py-1.5 text-right text-zinc-100 text-sm focus:outline-none focus:border-amber-500 placeholder:text-zinc-700";
  const txt = "bg-zinc-900 border border-zinc-700 rounded-lg px-2 py-1.5 text-zinc-100 text-sm focus:outline-none focus:border-amber-500 placeholder:text-zinc-700";
  const card = "bg-zinc-900/60 border border-zinc-800 rounded-xl p-3";

  const renderHelpers = (list, key, onPrice, offPrice) => {
    const up = (id, p) => set({ [key]: list.map((h) => (h.id === id ? { ...h, ...p } : h)) });
    const rm = (id) => set({ [key]: list.filter((h) => h.id !== id) });
    const adj = (h, d) => { const base = (h.manual != null && h.manual !== "") ? Number(h.manual) || 0 : effTime(h, now); up(h.id, { manual: Math.max(0, r1(base + d)) }); };
    return list.map((h) => {
      const t = effTime(h, now);
      const { onT, offT, amt } = calcTc(h, onPrice, offPrice);
      const manualOn = h.manual != null && h.manual !== "";
      const running = !!h.start && !h.end && !manualOn;
      return (
        <div key={h.id} className="bg-zinc-900/50 rounded-lg p-2 space-y-2">
          <div className="flex items-center gap-2">
            <input value={h.name} onChange={(e) => up(h.id, { name: e.target.value })} placeholder="이름" className="flex-1 min-w-0 bg-zinc-900 border border-zinc-700 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-amber-500 placeholder:text-zinc-700" />
            <div className="text-right shrink-0">
              <div className="text-sm text-zinc-200">{won(amt)}</div>
              {(onT > 0 || offT > 0 || h.nom) && <div className="text-[9px] text-zinc-500">O{f1(onT)}·X{f1(offT)}{h.nom ? " +지명" : ""}</div>}
            </div>
            <button onClick={() => rm(h.id)} className="text-zinc-600 active:text-red-400 shrink-0"><Trash2 size={15} /></button>
          </div>
          <div className="flex items-center gap-1.5">
            <button onClick={() => up(h.id, { nom: !h.nom })} className={"text-[11px] px-2 py-1.5 rounded-lg border " + (h.nom ? "border-emerald-500/60 text-emerald-400 bg-emerald-500/10" : "border-zinc-700 text-zinc-500")}>지명</button>
            <button onClick={() => up(h.id, { wing: !h.wing })} className={"text-[11px] px-2 py-1.5 rounded-lg border " + (h.wing ? "border-amber-500/60 text-amber-400 bg-amber-500/10" : "border-zinc-700 text-zinc-500")}>날개</button>
            <div className="ml-auto flex items-center gap-1.5">
              <span className="text-[10px] text-zinc-500">시작</span>
              <input value={h.start} onChange={(e) => up(h.id, { start: e.target.value })} placeholder="11.05" className="w-14 bg-zinc-900 border border-zinc-700 rounded-lg px-1 py-1.5 text-sm text-center focus:outline-none focus:border-amber-500 placeholder:text-zinc-700" />
              <button onClick={() => up(h.id, { end: h.end ? null : now })} className={"text-[11px] px-2 py-1.5 rounded-lg border " + (h.end ? "border-zinc-600 text-zinc-400" : "border-emerald-500/60 text-emerald-400 bg-emerald-500/10")}>{h.end ? "진행" : "끝"}</button>
            </div>
          </div>
          <div className="flex items-center gap-1.5">
            <span className="text-[10px] text-zinc-500">타임</span>
            <div className="flex items-center border border-zinc-700 rounded-lg overflow-hidden">
              <button onClick={() => adj(h, -0.5)} className="px-3 py-1.5 bg-zinc-800 text-lg leading-none active:bg-zinc-700">−</button>
              <input inputMode="decimal" value={manualOn ? h.manual : f1(t)} onChange={(e) => { const v = e.target.value.replace(/[^0-9.]/g, ""); up(h.id, { manual: v === "" ? null : v }); }} className="w-12 text-center bg-zinc-900 py-1.5 text-sm text-zinc-100 focus:outline-none" />
              <button onClick={() => adj(h, 0.5)} className="px-3 py-1.5 bg-zinc-800 text-lg leading-none active:bg-zinc-700">＋</button>
            </div>
            {running && <span className="text-[10px] text-emerald-400/70">자동</span>}
            {h.start && h.end && !manualOn && <span className="text-[10px] text-zinc-500">끝</span>}
            {manualOn && <span className="text-[10px] text-amber-400/70">수동</span>}
          </div>
        </div>
      );
    });
  };

  const titleInp = "bg-zinc-900 border border-zinc-700 rounded-lg px-2 py-1.5 text-sm text-zinc-100 focus:outline-none focus:border-amber-500 placeholder:text-zinc-700";

  return (
    <div className="min-h-screen bg-zinc-950 text-zinc-200" style={{fontFamily:"-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif"}}>
      <div className="max-w-md mx-auto px-4 py-5 pb-28">
        {/* 상단 바 */}
        <div className="flex items-center justify-between mb-3">
          <button onClick={onBack} className="flex items-center gap-1 text-sm text-zinc-400 active:text-zinc-200"><Back size={16} /> 목록</button>
          <div className="flex items-center gap-2">
            <button onClick={() => setShowHelp(true)} className="w-8 h-8 rounded-full border border-zinc-700 text-zinc-400 text-sm font-bold active:bg-zinc-800">?</button>
            <button onClick={onToggleDone} className={"text-xs px-3 py-1.5 rounded-lg border " + (s.done ? "border-emerald-500/60 text-emerald-400 bg-emerald-500/10" : "border-zinc-700 text-zinc-400")}>{s.done ? "완료됨" : "완료"}</button>
          </div>
        </div>

        {/* 제목 (날짜/방/웨이터/부) */}
        <div className={card + " mb-3"}>
          <div className="grid grid-cols-3 gap-2">
            <div><label className="text-[10px] text-zinc-500 block mb-1">날짜</label><input value={s.date} onChange={(e) => set({ date: e.target.value })} placeholder="6/5" className={titleInp + " w-full"} /></div>
            <div><label className="text-[10px] text-zinc-500 block mb-1">방</label><input value={s.room} onChange={(e) => set({ room: e.target.value })} placeholder="102" className={titleInp + " w-full"} /></div>
            <div><label className="text-[10px] text-zinc-500 block mb-1">웨이터</label><input value={s.waiter} onChange={(e) => set({ waiter: e.target.value })} placeholder="이름" className={titleInp + " w-full"} /></div>
          </div>
          <div className="flex items-center gap-2 mt-2">
            <span className="text-[10px] text-zinc-500">부</span>
            <div className="flex rounded-lg overflow-hidden border border-zinc-700">
              <button onClick={() => set({ part: "1부" })} className={"px-3 py-1 text-[11px] " + (s.part === "1부" ? "bg-amber-500 text-zinc-950" : "text-zinc-400")}>1부</button>
              <button onClick={() => set({ part: "2부" })} className={"px-3 py-1 text-[11px] " + (s.part === "2부" ? "bg-amber-500 text-zinc-950" : "text-zinc-400")}>2부</button>
            </div>
          </div>
        </div>

        {showHelp && (
          <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4" onClick={() => setShowHelp(false)}>
            <div className="bg-zinc-900 border border-zinc-700 rounded-2xl max-w-md w-full max-h-[85vh] overflow-y-auto p-5 text-sm leading-relaxed" onClick={(e) => e.stopPropagation()}>
              <div className="flex items-center justify-between mb-3"><span className="text-lg font-bold text-amber-400">사용법</span><button onClick={() => setShowHelp(false)} className="text-zinc-500 text-xl leading-none px-2">✕</button></div>
              <p className="text-zinc-400 mb-3">금액은 전부 <b className="text-zinc-200">만원 단위</b> (12=12만, 0.6=6천원). 입력은 자동 저장돼요.</p>
              <ul className="space-y-2 text-zinc-300">
                <li><b className="text-zinc-100">제목</b> — 날짜·방·웨이터·부. 목록에서 이걸로 구분돼요.</li>
                <li><b className="text-zinc-100">술</b> — 이름·병수·단가 줄 추가. ★로 술 저장 → 칩 누르면 단가 자동.</li>
                <li><b className="text-zinc-100">티씨</b> — 술O/술X 단가 한 번 입력 → 도우미는 이름·타임만. 지명=타임당+1만, 날개=2명+메이드.</li>
                <li><b className="text-zinc-100">룸티·사입·서비스</b> — 할인=빼줌, 받을돈=웨이터 몫.</li>
                <li><b className="text-zinc-100">완료</b> — 정산 끝나면 우상단 '완료'. 목록의 완료 탭으로 가요.</li>
              </ul>
              <button onClick={() => setShowHelp(false)} className="w-full mt-4 py-2.5 rounded-lg bg-amber-500 text-zinc-950 font-semibold">확인</button>
            </div>
          </div>
        )}

        {/* 인원 */}
        <div className="flex items-center justify-between bg-zinc-900/60 border border-zinc-800 rounded-xl px-3 py-2 mb-3">
          <div className="flex items-center gap-2">
            <Users size={15} />
            <div className="flex rounded-lg overflow-hidden border border-zinc-700">
              <button onClick={() => set({ guestMode: "남" })} className={"px-3 py-1.5 text-xs " + (s.guestMode === "남" ? "bg-amber-500 text-zinc-950" : "text-zinc-400")}>남</button>
              <button onClick={() => set({ guestMode: "아베크" })} className={"px-3 py-1.5 text-xs " + (s.guestMode === "아베크" ? "bg-sky-500 text-white" : "text-zinc-400")}>아베크</button>
            </div>
          </div>
          <NumStepper value={s.numGuest} set={(fn) => set({ numGuest: typeof fn === "function" ? fn(s.numGuest) : fn })} min={1} step={1} />
        </div>

        {/* 술 */}
        <div className={card + " mb-3"}>
          <div className="flex items-center gap-1.5 text-sm font-medium text-amber-300 mb-3"><Wine size={15} /> 술</div>
          <div className="space-y-2">
            {s.drinks.map((d) => (
              <div key={d.id} className="bg-zinc-900/50 rounded-lg p-2 space-y-2">
                <div className="flex items-center gap-2">
                  <input value={d.name} onChange={(e) => upD(d.id, { name: e.target.value })} placeholder="술 이름" className="flex-1 min-w-0 bg-zinc-900 border border-zinc-700 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-amber-500 placeholder:text-zinc-700" />
                  <button onClick={() => toggleSave(d)} className={"shrink-0 " + (isSaved(d.name) ? "text-amber-400" : "text-zinc-600")}><Star size={16} fill={isSaved(d.name) ? "currentColor" : "none"} /></button>
                  <button onClick={() => rmD(d.id)} className="text-zinc-600 active:text-red-400 shrink-0"><Trash2 size={15} /></button>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] text-zinc-500">병수</span><NumStepper value={d.bottles} set={setDBottles(d.id, d.bottles)} min={0} step={1} />
                  <span className="text-[10px] text-zinc-500 ml-1">단가</span><input inputMode="decimal" value={d.price} onChange={(e) => upD(d.id, { price: num(e.target.value) })} placeholder="만원" className={inp + " w-16"} />
                  <span className="ml-auto text-sm text-zinc-200">{won((Number(d.bottles) || 0) * (Number(d.price) || 0))}</span>
                </div>
              </div>
            ))}
          </div>
          <button onClick={addD} className="w-full mt-2 flex items-center justify-center gap-1 text-xs text-zinc-400 border border-dashed border-zinc-700 rounded-lg py-2"><Plus size={13} /> 술 추가</button>
          {savedDrinks.length > 0 && (
            <div className="mt-3 flex flex-wrap gap-1.5">
              <span className="text-[10px] text-zinc-500 self-center">저장된 술</span>
              {savedDrinks.map((sd, i) => (<button key={i} onClick={() => useSaved(sd)} className="text-[11px] px-2 py-1 rounded-md border border-zinc-700 text-zinc-300 active:bg-zinc-800">{sd.name} {sd.price}</button>))}
            </div>
          )}
          <div className="text-right mt-2 text-sm"><span className="text-zinc-500">술 합계 </span><span className="font-semibold text-amber-300">{won(liquorAmt)}</span></div>
        </div>

        {shortBottles && (
          <div className="mb-3 text-[12px] text-amber-300 bg-amber-500/10 border border-amber-500/30 rounded-lg px-3 py-2">
            ⚠ 타임 합 {f1(totalTimes)} &gt; 술 {totalBottles}병 — {f1(r1(totalTimes - totalBottles))}타임은 술X 단가로 계산돼요. 술이 더 들어가야 하면 위에서 병수를 올리세요.
          </div>
        )}

        {/* 티씨 */}
        <div className={card + " mb-3"}>
          <div className="flex items-center justify-between mb-2">
            <span className="text-sm font-medium text-zinc-100">티씨 단가 <span className="text-[10px] text-pink-300">여</span></span>
            <div className="flex items-center gap-2 text-xs">
              <span className="text-amber-300">술O</span><input inputMode="decimal" value={s.tcOn} onChange={(e) => set({ tcOn: num(e.target.value) })} className={inp + " w-14"} />
              <span className="text-zinc-400">술X</span><input inputMode="decimal" value={s.tcOff} onChange={(e) => set({ tcOff: num(e.target.value) })} className={inp + " w-14"} />
            </div>
          </div>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-[11px] text-zinc-500">술O 적용</span>
            <div className="flex rounded-lg overflow-hidden border border-zinc-700">
              <button onClick={() => set({ splitMode: "bottle" })} className={"px-2 py-1 text-[11px] " + (s.splitMode === "bottle" ? "bg-amber-500 text-zinc-950" : "text-zinc-400")}>병수만큼</button>
              <button onClick={() => set({ splitMode: "first" })} className={"px-2 py-1 text-[11px] " + (s.splitMode === "first" ? "bg-amber-500 text-zinc-950" : "text-zinc-400")}>첫타임만</button>
            </div>
          </div>
          {(!s.tcOn || !s.tcOff)
            ? <p className="text-[11px] text-red-400/80 mb-3">⚠ 술O·술X 단가를 둘 다 채워야 계산돼요</p>
            : <p className="text-[11px] text-zinc-500 mb-3">{s.splitMode === "first" ? `첫 타임만 술O(${s.tcOn}), 나머지 술X(${s.tcOff})` : `술 ${totalBottles}병 → ${totalBottles}타임 술O(${s.tcOn}), 나머지 술X(${s.tcOff})`} · 지명 타임당 +1</p>}
          <div className="space-y-2">{renderHelpers(s.helpers, "helpers", onP, offP)}</div>
          <button onClick={() => set({ helpers: [...s.helpers, { id: Date.now(), name: "", start: "", end: null, manual: null, wing: false, nom: false }] })} className="w-full mt-2 flex items-center justify-center gap-1 text-xs text-zinc-400 border border-dashed border-zinc-700 rounded-lg py-2"><Plus size={13} /> 도우미 추가</button>
          <div className="text-right mt-2 text-sm"><span className="text-zinc-500">티씨 합계 </span><span className="font-semibold text-zinc-100">{won(tcTotal)}</span></div>
        </div>

        {/* 선수 */}
        {s.guestMode === "아베크" && (
          <div className={card + " mb-3"}>
            <div className="flex items-center justify-between mb-2">
              <span className="text-sm font-medium text-zinc-100">선수 단가 <span className="text-[10px] text-sky-300">남</span></span>
              <div className="flex items-center gap-2 text-xs">
                <span className="text-amber-300">술O</span><input inputMode="decimal" value={s.mTcOn} onChange={(e) => set({ mTcOn: num(e.target.value) })} className={inp + " w-14"} />
                <span className="text-zinc-400">술X</span><input inputMode="decimal" value={s.mTcOff} onChange={(e) => set({ mTcOff: num(e.target.value) })} className={inp + " w-14"} />
              </div>
            </div>
            {(!s.mTcOn || !s.mTcOff) && <p className="text-[11px] text-red-400/80 mb-3">⚠ 선수 술O·술X 단가를 채워야 계산돼요</p>}
            <div className="space-y-2">{renderHelpers(s.mHelpers, "mHelpers", mOnP, mOffP)}</div>
            <button onClick={() => set({ mHelpers: [...s.mHelpers, { id: Date.now(), name: "", start: "", end: null, manual: null, wing: false, nom: false }] })} className="w-full mt-2 flex items-center justify-center gap-1 text-xs text-zinc-400 border border-dashed border-zinc-700 rounded-lg py-2"><Plus size={13} /> 선수 추가</button>
            <div className="text-right mt-2 text-sm"><span className="text-zinc-500">선수 합계 </span><span className="font-semibold text-zinc-100">{won(mTcTotal)}</span></div>
          </div>
        )}

        {/* 룸티·사입·서비스 */}
        <div className={card}>
          <span className="text-sm font-medium text-zinc-100">룸티 · 사입 · 서비스 · 기타</span>
          <div className="space-y-2 mt-3">
            {s.items.map((it) => (
              <div key={it.id} className="flex items-center gap-2">
                <input value={it.name} onChange={(e) => upI(it.id, { name: e.target.value })} placeholder="항목명" className="flex-1 min-w-0 bg-zinc-900 border border-zinc-700 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-amber-500 placeholder:text-zinc-700" />
                <span className={"text-xs shrink-0 " + (it.discount ? "text-red-400" : "text-zinc-600")}>{it.discount ? "−" : ""}</span>
                <input inputMode="decimal" value={it.amount} onChange={(e) => upI(it.id, { amount: num(e.target.value) })} placeholder="만원" className={inp + " w-16"} />
                <button onClick={() => upI(it.id, { discount: !it.discount, waiter: it.discount ? it.waiter : false })} className={"text-[10px] px-1.5 py-1 rounded-md border whitespace-nowrap " + (it.discount ? "border-red-500/60 text-red-400 bg-red-500/10" : "border-zinc-700 text-zinc-600")}>할인</button>
                <button onClick={() => upI(it.id, { waiter: !it.waiter, discount: it.waiter ? it.discount : false })} className={"text-[10px] px-1.5 py-1 rounded-md border whitespace-nowrap " + (it.waiter ? "border-sky-500/60 text-sky-300 bg-sky-500/10" : "border-zinc-700 text-zinc-600")}>받을돈</button>
                <button onClick={() => rmI(it.id)} className="text-zinc-600 active:text-red-400"><Trash2 size={15} /></button>
              </div>
            ))}
          </div>
          <button onClick={addI} className="w-full mt-2 flex items-center justify-center gap-1 text-xs text-zinc-400 border border-dashed border-zinc-700 rounded-lg py-2"><Plus size={13} /> 항목 추가</button>
          <div className="mt-3 pt-3 border-t border-zinc-800">
            <label className="text-xs text-zinc-400 block mb-1">사입 내역 메모 <span className="text-[10px] text-zinc-600">계산 X · 손님 확인용</span></label>
            <textarea value={s.sipMemo} onChange={(e) => set({ sipMemo: e.target.value })} rows={2} placeholder="예) 발렌타인 12년, 안주 과일" className={txt + " w-full text-left resize-none"} />
          </div>
        </div>

        <div className="mt-6 space-y-2">
          <div className="flex items-center justify-between px-1"><span className="text-zinc-400">손님 합계</span><span className="text-3xl font-bold text-amber-400 tracking-tight">{won(total)}</span></div>
          <div className="flex items-center justify-between px-1 border-t border-zinc-800 pt-2"><span className="text-zinc-400 text-sm">웨이터 받을돈 <span className="text-[10px] text-zinc-600">룸티+사입</span></span><span className="text-xl font-bold text-sky-400">{won(waiterTotal)}</span></div>
          {wingCount > 0 && <div className="text-right text-[11px] text-amber-400/80">날개 {wingCount}</div>}
        </div>

        <div className="mt-6">
          <div className="flex items-center justify-between mb-2">
            <span className="text-sm text-zinc-400">손님 문자 미리보기</span>
            <button onClick={copy} className="flex items-center gap-1 text-xs px-3 py-1.5 rounded-lg bg-amber-500 text-zinc-950 font-semibold active:bg-amber-400">{copied ? <span className="flex items-center gap-1"><Check size={14} /> 복사됨</span> : <span className="flex items-center gap-1"><Copy size={14} /> 복사</span>}</button>
          </div>
          <pre className="bg-zinc-900 border border-zinc-800 rounded-xl p-4 text-sm text-zinc-300 whitespace-pre-wrap leading-relaxed" style={{fontFamily:"ui-monospace,SFMono-Regular,monospace"}}>{billText}</pre>
        </div>

        <button onClick={onDelete} className="w-full mt-8 text-xs text-zinc-600 active:text-red-400 py-2">이 계산서 삭제</button>
      </div>
    </div>
  );
}

function App() {
  const [sheets, setSheets] = useState(() => load("calcSheets", []));
  const [savedDrinks, setSavedDrinks] = useState(() => load("calcDrinks", []));
  const [openId, setOpenId] = useState(null);
  const [tab, setTab] = useState("ing"); // ing | done

  useEffect(() => { save("calcSheets", sheets); }, [sheets]);
  useEffect(() => { save("calcDrinks", savedDrinks); }, [savedDrinks]);

  const open = sheets.find((s) => s.id === openId);
  const updateSheet = (ns) => setSheets((arr) => arr.map((s) => (s.id === ns.id ? ns : s)));
  const create = () => { const ns = newSheet(); setSheets((a) => [ns, ...a]); setOpenId(ns.id); };
  const toggleDone = (id) => setSheets((a) => a.map((s) => (s.id === id ? { ...s, done: !s.done } : s)));
  const del = (id) => { setSheets((a) => a.filter((s) => s.id !== id)); setOpenId(null); };

  if (open) {
    return <CalcSheet sheet={open} onChange={updateSheet} onBack={() => setOpenId(null)}
      onToggleDone={() => toggleDone(open.id)} onDelete={() => { if (confirm("이 계산서를 삭제할까요?")) del(open.id); }}
      savedDrinks={savedDrinks} setSavedDrinks={setSavedDrinks} />;
  }

  const list = sheets.filter((s) => (tab === "done" ? s.done : !s.done));
  return (
    <div className="min-h-screen bg-zinc-950 text-zinc-200" style={{fontFamily:"-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif"}}>
      <div className="max-w-md mx-auto px-4 py-6 pb-28">
        <h1 className="text-2xl font-bold tracking-tight text-amber-400 mb-1">계산서</h1>
        <p className="text-xs text-zinc-500 mb-4">{new Date().toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "short" })}</p>

        <div className="flex rounded-lg overflow-hidden border border-zinc-700 mb-4">
          <button onClick={() => setTab("ing")} className={"flex-1 py-2 text-sm " + (tab === "ing" ? "bg-amber-500 text-zinc-950 font-semibold" : "text-zinc-400")}>진행 중 ({sheets.filter((s) => !s.done).length})</button>
          <button onClick={() => setTab("done")} className={"flex-1 py-2 text-sm " + (tab === "done" ? "bg-amber-500 text-zinc-950 font-semibold" : "text-zinc-400")}>완료 ({sheets.filter((s) => s.done).length})</button>
        </div>

        <button onClick={create} className="w-full mb-4 flex items-center justify-center gap-1.5 bg-zinc-800 border border-zinc-700 rounded-xl py-3 text-sm text-zinc-100 active:bg-zinc-700"><Plus size={16} /> 새 계산서</button>

        {list.length === 0 ? (
          <p className="text-center text-sm text-zinc-600 mt-10">{tab === "ing" ? "진행 중인 계산서가 없어요. '새 계산서'로 시작하세요." : "완료된 계산서가 없어요."}</p>
        ) : (
          <div className="space-y-2">
            {list.map((s) => {
              const title = [s.date, s.room && s.room + "호", s.waiter].filter(Boolean).join(" · ") || "(제목 없음)";
              return (
                <button key={s.id} onClick={() => setOpenId(s.id)} className="w-full text-left bg-zinc-900/60 border border-zinc-800 rounded-xl px-4 py-3 active:bg-zinc-800">
                  <div className="flex items-center justify-between">
                    <span className="text-sm text-zinc-100">{title} <span className="text-[10px] text-zinc-500">{s.part}</span></span>
                    <span className="text-amber-400 font-semibold">{won(sheetTotal(s))}</span>
                  </div>
                </button>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script data-goatcounter="https://youngjungkang.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
